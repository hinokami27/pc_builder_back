<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <title>Title</title>
    <style>
        #wrap{
            width: 1000px;
            height: 1200px;
            margin: 100px auto 0;
        }
    </style>
</head>
<body>
<div id="wrap">
    <form method="post" th:action="@{'/gpu/edit'}">
        <input type="hidden" name="id" th:value="(${gpu} !=null ? ${gpu.getId()} : '')">
        <div>ModelName</div>
        <input class="form-control" type="text" name="modelName" th:value="(${gpu} !=null ? ${gpu.getModelName()} : '')"><br>
        <div>Price</div>
        <input class="form-control" type="text" name="priceMkd" th:value="(${gpu} !=null ? ${gpu.getPriceMkd()} : '')"><br>
        <div>StoreName</div>
        <input class="form-control" type="text" name="storeName" th:value="(${gpu} !=null ? ${gpu.getStoreName()} : '')"><br>
        <div>StoreUrl</div>
        <input class="form-control" type="text" name="storeUrl" th:value="(${gpu} !=null ? ${gpu.getStoreUrl()} : '')"><br>
        <div>ImgUrl</div>
        <input class="form-control" type="text" name="imgUrl" th:value="(${gpu} !=null ? ${gpu.getImgUrl()} : '')"><br>
        <div>VRAM</div>
        <input class="form-control" type="text" name="packageType" th:value="(${gpu} !=null ? ${gpu.getVram()} : '')"><br>
        <div>Brand</div>
        <input class="form-control" type="text" name="brand" th:value="(${gpu} !=null ? ${gpu.getBrand()} : '')"><br>
        <div>Chipset</div>
        <input class="form-control" type="text" name="ramSpeed" th:value="(${gpu} !=null ? ${gpu.getChipset()} : '')"><br>
        <div>Chipmaker</div>
        <input class="form-control" type="text" name="ramType" th:value="(${gpu} !=null ? ${gpu.getChipMaker()} : '')"><br>
        <div>Length</div>
        <input class="form-control" type="text" name="socket" th:value="(${gpu} !=null ? ${gpu.getLength()} : '')"><br>
        <button class="btn btn-primary btn-lg" type="submit">Edit</button>
    </form>
</div>
</body>
</html>
