<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <title>CheckPrice</title>
    <meta name="referrer" content="no-referrer">
    <meta name="referrer" content="no-referrer">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <style>
        img{
            max-height: 100px;
            max-width: 100px;
        }
        ul{
            list-style-type: none;
            padding: 0px;
        }
        .rescrapeBtn{
            width: 120px;
            height: 40px;
            line-height: 40px;
            text-align: center;
            background-color: #39117e;
            color: #b6c2cd;
            position: fixed;
            bottom: 30px;
            left: 30px;
            border-radius: 6px;
            font-size: 16px;
        }
        #navbar{
            padding: 20px 0px;
            display: flex;
            justify-content: space-evenly;
        }
        table{
            border: 1px solid #F2F2F2;
        }
        a{
            text-decoration: none;
        }
    </style>
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<table class="table table-striped">
    <thead>
    <tr>
        <th scope="col">#</th>
        <th scope="col">StoreURL</th>
        <th scope="col">Date</th>
        <th scope="col">Price</th>
        <th scope="col">Edit</th>
        <th scope="col">Delete</th>
    </tr>
    </thead>
    <tbody>
        <tr th:each="priceDate : ${priceDates}">
            <td></td>
            <td th:text="${priceDate.getStoreUrl()}"></td>
            <td th:text="${priceDate.getDate()}"></td>
            <td th:text="${priceDate.getPrice()}"></td>
            <td><a class="btn btn-info">Edit</a></td>
            <td><a class="btn btn-danger">Delete</a></td>
        </tr>
    </tbody>
</table>
<div th:replace="~{fragments :: datatable-scripts}"></div>
</body>
</html>
