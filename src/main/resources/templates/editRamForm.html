<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <title>Title</title>
    <style>
        #wrap{
            width: 1000px;
            height: 1200px;
            margin: 100px auto 0;
        }
    </style>
</head>
<body>
<div id="wrap">
    <form method="post" th:action="@{'/ram/edit'}">
        <input type="hidden" name="id" th:value="(${ram} !=null ? ${ram.getId()} : '')">
        <div>ModelName</div>
        <input class="form-control" type="text" name="modelName" th:value="(${ram} !=null ? ${ram.getModelName()} : '')"><br>
        <div>Price</div>
        <input class="form-control" type="text" name="priceMkd" th:value="(${ram} !=null ? ${ram.getPriceMkd()} : '')"><br>
        <div>StoreName</div>
        <input class="form-control" type="text" name="storeName" th:value="(${ram} !=null ? ${ram.getStoreName()} : '')"><br>
        <div>StoreUrl</div>
        <input class="form-control" type="text" name="storeUrl" th:value="(${ram} !=null ? ${ram.getStoreUrl()} : '')"><br>
        <div>ImgUrl</div>
        <input class="form-control" type="text" name="imgUrl" th:value="(${ram} !=null ? ${ram.getImgUrl()} : '')"><br>
        <div>RamSize</div>
        <input class="form-control" type="text" name="ramSize" th:value="(${ram} !=null ? ${ram.getRamSize()} : '')"><br>
        <div>RamType</div>
        <input class="form-control" type="text" name="ramType" th:value="(${ram} !=null ? ${ram.getRamType()} : '')"><br>
        <div>RamSpeed</div>
        <input class="form-control" type="text" name="ramSpeed" th:value="(${ram} !=null ? ${ram.getRamSpeed()} : '')"><br>
        <div>Latency</div>
        <input class="form-control" type="text" name="latency" th:value="(${ram} !=null ? ${ram.getLatency()} : '')"><br>
        <div>Configuration</div>
        <input class="form-control" type="text" name="configuration" th:value="(${ram} !=null ? ${ram.getConfiguration()} : '')"><br>
        <div>Brand</div>
        <input class="form-control" type="text" name="brand" th:value="(${ram} !=null ? ${ram.getBrand()} : '')"><br>
        <button class="btn btn-primary btn-lg" type="submit">Edit</button>
    </form>
</div>
</body>
</html>
