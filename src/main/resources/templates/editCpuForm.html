<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <title>Title</title>
    <style>
        #wrap{
            width: 1000px;
            height: 1200px;
            margin: 100px auto 0;
        }
    </style>
</head>
<body>
<div id="wrap">
    <form method="post" th:action="@{'/cpu/edit'}">
        <input type="hidden" name="id" th:value="(${cpu} !=null ? ${cpu.getId()} : '')">
        <div>ModelName</div>
        <input class="form-control" type="text" name="modelName" th:value="(${cpu} !=null ? ${cpu.getModelName()} : '')"><br>
        <div>Price</div>
        <input class="form-control" type="text" name="priceMkd" th:value="(${cpu} !=null ? ${cpu.getPriceMkd()} : '')"><br>
        <div>StoreName</div>
        <input class="form-control" type="text" name="storeName" th:value="(${cpu} !=null ? ${cpu.getStoreName()} : '')"><br>
        <div>StoreUrl</div>
        <input class="form-control" type="text" name="storeUrl" th:value="(${cpu} !=null ? ${cpu.getStoreUrl()} : '')"><br>
        <div>ImgUrl</div>
        <input class="form-control" type="text" name="imgUrl" th:value="(${cpu} !=null ? ${cpu.getImgUrl()} : '')"><br>
        <div>PackageType</div>
        <input class="form-control" type="text" name="packageType" th:value="(${cpu} !=null ? ${cpu.getPackageType()} : '')"><br>
        <div>Brand</div>
        <input class="form-control" type="text" name="brand" th:value="(${cpu} !=null ? ${cpu.getBrand()} : '')"><br>
        <div>Socket</div>
        <input class="form-control" type="text" name="socket" th:value="(${cpu} !=null ? ${cpu.getSocket()} : '')"><br>
        <div>Cores</div>
        <input class="form-control" type="text" name="cores" th:value="(${cpu} !=null ? ${cpu.getCores()} : '')"><br>
        <div>Threads</div>
        <input class="form-control" type="text" name="threads" th:value="(${cpu} !=null ? ${cpu.getThreads()} : '')"><br>
        <button class="btn btn-primary btn-lg" type="submit">Edit</button>
    </form>
</div>
</body>
</html>
