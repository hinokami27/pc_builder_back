<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <title>Title</title>
    <style>
        #wrap{
            width: 1000px;
            height: 1200px;
            margin: 100px auto 0;
        }
    </style>
</head>
<body>
<div id="wrap">
    <form method="post" th:action="@{'/motherboard/edit'}">
        <input type="hidden" name="id" th:value="(${motherboard} !=null ? ${motherboard.getId()} : '')">
        <div>ModelName</div>
        <input class="form-control" type="text" name="modelName" th:value="(${motherboard} !=null ? ${motherboard.getModelName()} : '')"><br>
        <div>Price</div>
        <input class="form-control" type="text" name="priceMkd" th:value="(${motherboard} !=null ? ${motherboard.getPriceMkd()} : '')"><br>
        <div>StoreName</div>
        <input class="form-control" type="text" name="storeName" th:value="(${motherboard} !=null ? ${motherboard.getStoreName()} : '')"><br>
        <div>StoreUrl</div>
        <input class="form-control" type="text" name="storeUrl" th:value="(${motherboard} !=null ? ${motherboard.getStoreUrl()} : '')"><br>
        <div>ImgUrl</div>
        <input class="form-control" type="text" name="imgUrl" th:value="(${motherboard} !=null ? ${motherboard.getImgUrl()} : '')"><br>
        <div>FormFactor</div>
        <input class="form-control" type="text" name="formFactor" th:value="(${motherboard} !=null ? ${motherboard.getFormFactor()} : '')"><br>
        <div>Brand</div>
        <input class="form-control" type="text" name="brand" th:value="(${motherboard} !=null ? ${motherboard.getBrand()} : '')"><br>
        <div>RamSpeed</div>
        <input class="form-control" type="text" name="ramSpeed" th:value="(${motherboard} !=null ? ${motherboard.getRamSpeed()} : '')"><br>
        <div>RamType</div>
        <input class="form-control" type="text" name="ramType" th:value="(${motherboard} !=null ? ${motherboard.getRamType()} : '')"><br>
        <div>Chipset</div>
        <input class="form-control" type="text" name="chipset" th:value="(${motherboard} !=null ? ${motherboard.getChipset()} : '')"><br>
        <div>Socket</div>
        <input class="form-control" type="text" name="socket" th:value="(${motherboard} !=null ? ${motherboard.getSocket()} : '')"><br>
        <button class="btn btn-primary btn-lg" type="submit">Edit</button>
    </form>
</div>
</body>
</html>
